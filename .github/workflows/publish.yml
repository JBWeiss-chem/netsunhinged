name: publish

# Publishes the package to PyPI when a GitHub release is published (tag "v1.2.3" for version 1.2.3).
# Uses PyPI trusted publishing: no password or API token is stored anywhere. One-time setup on
# pypi.org, see "Releasing" in the README.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the package version
        run: |
          # read __version__ without importing the package (numpy is not installed yet)
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('netsunhinged/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match the package version ${version} (expected tag v${version})"
            exit 1
          fi
      - name: Run the tests
        run: |
          python -m pip install ".[dev]"
          python -m pytest -q
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # the environment must match the trusted publisher configured on pypi.org
    environment:
      name: pypi
      url: https://pypi.org/project/netsunhinged/
    permissions:
      id-token: write          # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
