name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -v

  # the installed package must work on its own: front end, bundled three.js and examples included
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python - <<'EOF'
          import os
          import netsunhinged.server as s
          static = os.listdir(s.STATIC)
          assert {"index.html", "app.js", "style.css", "vendor"} <= set(static), static
          for f in s.STATIC_FILES.values():
              assert os.path.isfile(os.path.join(s.STATIC, f)), f
          items = [i for g in s.api_examples(None)["groups"] for i in g["items"]]
          assert len(items) >= 10, items
          print("ok:", len(items), "examples, static files present")
          EOF
          ex=$(/tmp/venv/bin/python -c "import netsunhinged, os; print(os.path.join(os.path.dirname(netsunhinged.__file__), 'examples', 'MIL-53-Ga_COD-7000776.cif'))")
          /tmp/venv/bin/netsunhinged analyze "$ex" --no-finite
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
